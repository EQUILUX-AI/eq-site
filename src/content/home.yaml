about:
  heading: About Us
  lead: Equilux AI brings intelligent balance to home energy.
  body: As electricity rates rise, homeowners face constant pressure to manage energy costs. Equilux AI combines adaptive technology with simple, human-centered design to automate your home energy ecosystem.
  items:
    - title: Continuous Learning
      body: Our software monitors, learns, and optimizes energy generation and usage in real time.
    - title: Maximum Efficiency
      body: Achieve perfect equilibrium between your solar output, energy consumption, and grid draw.
    - title: Effortless Savings
      body: Enjoy lower monthly utility bills and a reduced carbon footprint without changing your daily habits.
faq:
  heading: Frequently Asked Questions
  items:
    - question: Do I need solar panels or a home battery to use Equilux AI?
      answer: While Equilux AI delivers maximum savings to homes with solar and battery storage, our smart load-shifting capabilities can also optimize standard grid-connected homes during off-peak tariff hours.
    - question: How hard is it to set up?
      answer: Installation takes under an hour with no major electrical rewiring required. Our software connects directly to your existing smart meters and smart home devices.
    - question: Will the AI disrupt my home routine?
      answer: Not at all. You maintain full manual control through our app at any time, while the system works quietly in the background to minimize waste.
